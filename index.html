<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <title>My Profile</title>
    <link rel="stylesheet" href="style.css"/>
    <script src="script.js" defer></script>
</head>
<body>
    <main Class="Profile-card">
        <img class="profile-photo" src="xd/68219010016.jpg" alt="รูปโปรไฟล์ของ ไกด์">
        <h1>My Profile</h1>
        <p>ชื่อ-นามสกุส: <span id="fullname">พงศกร อินคชสาร</span></p>
        <p>ชื่อเล่น: <span id="nickname">ไกด์</span></p>
        <p>รหัสประจำตัว: <span id="studentID">68219010016</span></p>

        <div class="motto">
            <h2>คติประจำใจ</h2>
            <p id="motto">เชื่อว่าความสำเร็จไม่ได้เกิดจากพรสรรค์ แต่เกิดจาก วินัย และความพยายาม ด้วยการเรียนรู้จากความผิดพลาด</p>
        </div>
        
        <button id="greetingBtn">ทักทาย</button>
        <p id="greetingMessage">ยินดีต้อนรับเข้าสู่โปรไฟล์ของ ไกด์</p>
    </main>
  </body>
</html>
